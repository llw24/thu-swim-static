name: 📝 发布活动
description: 填表发布活动预告，机器人自动更新网站
labels: ["发布"]
body:
  - type: input
    id: title
    attributes:
      label: 活动名称
      placeholder: 如：新生游泳体验课
    validations: { required: true }

  - type: textarea
    id: summary
    attributes:
      label: 活动简介
      description: 一两句话，显示在预告卡片上（选填）
    validations: { required: false }

  - type: textarea
    id: body
    attributes:
      label: 详细说明
      description: 支持 Markdown（选填）；不填则显示默认提示"参加方式以群内通知为准"
    validations: { required: false }

  - type: input
    id: schedule
    attributes:
      label: 活动时间
      placeholder: 每周二 / 周四晚 19:00–20:30
    validations: { required: false }

  - type: input
    id: location
    attributes:
      label: 活动地点
      placeholder: 陈明游泳馆
    validations: { required: false }

  - type: input
    id: price
    attributes:
      label: 费用
      placeholder: 200 元 / 人
    validations: { required: false }

  - type: dropdown
    id: status
    attributes:
      label: 活动状态
      options: [即将开展, 已结束]
    validations: { required: true }
