name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 自动适配仓库名：项目页挂在 https://<owner>.github.io/<repo>/
      - name: Compute site URLs
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "BASE=/${REPO}" >> "$GITHUB_ENV"
          echo "SITE_URL=https://${OWNER}.github.io/${REPO}" >> "$GITHUB_ENV"

      - run: npm ci || npm install --no-audit --no-fund

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ env.BASE }}
          SITE_URL: ${{ env.SITE_URL }}
          # 验证服务（老站）地址 —— 仓库 Settings → Secrets and variables → Actions 配置。
          # 属于公开信息（不是密钥），但需要重新构建部署才会生效。
          # 未配置时回退到默认地址，入群验证/报名功能仍可用。
          NEXT_PUBLIC_JOIN_API: ${{ secrets.NEXT_PUBLIC_JOIN_API }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
