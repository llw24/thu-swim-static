name: Keep verification API warm

# 借用静态站（公开仓库，Actions 免费额度不限）的定时任务给老站验证服务保活：
# 每 5 分钟 ping 一次 /api/health，减少 Netlify 函数冷启动，让发码/验证响应更快。
# 服务本身故障时这里只是 warning，不阻塞 —— 故障排查见老站 HANDOFF 的诊断速查表。
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://thu-swim.netlify.app/api/health || true)
          echo "health: $code"
          if [ "$code" != "200" ]; then echo "::warning::health check returned $code"; fi
