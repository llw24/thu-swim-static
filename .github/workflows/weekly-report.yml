name: Weekly report (周报邮件)

on:
  schedule:
    # UTC 周一 01:00 = 北京时间周一 09:00
    - cron: '0 1 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 汇总本周 content/ 变更
        run: |
          {
            echo "清华游协官网 · 本周内容更新汇总"
            echo ""
            echo "本周 content/ 目录变更记录："
            echo ""
            git log --since="7 days ago" --pretty=format:"%ad %s" --date=short -- content/ || true
            echo ""
            echo ""
            echo "----"
            echo "本邮件由 GitHub Actions 自动发送"
          } > summary.txt

      - name: 发送邮件
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp-relay.brevo.com
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: 游协官网周报 · 本周内容更新
          to: ${{ secrets.ADMIN_EMAIL }}
          from: 游协官网机器人 <${{ secrets.SMTP_USER }}>
          body: file://summary.txt
